name: EngineRouter contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test router contracts and native adapters without model downloads
        run: |
          xcodebuild test -scheme EngineRouter-Package -destination 'platform=macOS' \
            -derivedDataPath .build/contracts -jobs 3 \
            -skipMacroValidation -skipPackagePluginValidation \
            -only-testing:EngineRouterTests
